name: Data, backtest and site

# Fetches 1-minute data (length per market in scripts/markets.json) and the Forex Factory calendar, runs the backtest,
# optionally writes the AI news brief, then publishes the app to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['engine/**', 'scripts/**', 'web/**', '.github/workflows/pipeline.yml']
  workflow_dispatch:
    inputs:
      days:
        description: Days of history for every market (leave empty to use markets.json)
        default: ''
  schedule:
    - cron: '23 22 * * 0-4'   # daily after the 17:00 New York rollover (Sun–Thu evenings UTC)
    - cron: '41 5,11,15 * * 1-5' # news refresh through the trading day

permissions:
  contents: write   # only used to save the results snapshot to the `results` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: pages
        uses: actions/configure-pages@v5
      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-
      - name: Fetch market data and news
        run: python scripts/build_data.py --out site/data --cache .cache --days "${{ github.event.inputs.days || '' }}" --prev-url "${{ steps.pages.outputs.base_url }}"
      - name: Save download cache (even if a later step fails)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: market-data-${{ github.run_id }}
      - name: Run backtest
        run: node scripts/run_backtest.mjs --data site/data --out site/data/results
      - name: AI news brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python scripts/ai_brief.py site/data
      - name: Save results to the results branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp -r site/data/results /tmp/out/ 2>/dev/null || true
          cp site/data/status.json site/data/markets.json /tmp/out/ 2>/dev/null || true
          cp site/data/news/brief.json /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Results snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" results
      - name: Build site
        run: node web/build.mjs --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
